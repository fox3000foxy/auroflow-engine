name: Windows Golden VM

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Session duration in minutes
        required: true
        default: '60'
        type: choice
        options:
          - '15'
          - '30'
          - '60'
          - '120'
          - '240'

permissions:
  contents: read

concurrency:
  group: windows-golden
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      GOLDEN_REPO: fox3000foxy/windows10-golden
      GOLDEN_TAG: golden-v1.0
      VM_MODE: fresh

    steps:
      - uses: actions/checkout@v5

      - name: Initialize
        run: |
          echo "VM_ROOT=$(mktemp -d "$RUNNER_TEMP/windows.XXXXXXXX")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils \
            qemu-block-extra ovmf \
            swtpm swtpm-tools socat

      - name: Verify virtualization
        run: |
          lscpu
          free -h
          df -h
          sudo test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          qemu-system-x86_64 --version
          qemu-system-x86_64 -machine help | grep -w pc-q35-10.0

      - name: Download Golden Image
        run: bash scripts/download-golden.sh

      - name: Restore layers
        run: bash scripts/restore-layers.sh

      - name: Boot Windows
        run: |
          nohup bash boot-vm.sh \
            > "$VM_ROOT/qemu.log" 2>&1 < /dev/null &

          for i in $(seq 1 60); do
            if test -S "$VM_ROOT/qmp.sock"; then
              exit 0
            fi
            sleep 1
          done

          cat "$VM_ROOT/qemu.log"
          exit 1

      - name: Wait for RDP
        run: |
          for i in $(seq 1 120); do
            if timeout 2 bash -c \
              'echo > /dev/tcp/127.0.0.1/3390' 2>/dev/null; then
              echo "Host RDP forwarding port reachable"
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Reserved: authenticated ngrok RDP tunnel.

      - name: Wait for shutdown
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          export DEADLINE=$(($(date +%s)+DURATION*60))
          python3 scripts/wait_shutdown.py

      # Reserved: persistent layer compression and publication.

      - name: Diagnostics
        if: always()
        run: |
          cat "$VM_ROOT/qemu.log" || true
          du -sh "$VM_ROOT" || true
